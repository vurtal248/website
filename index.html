<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Showcase — Absolute Monochrome</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400..800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Palette */
            --bg-base: #000000;
            --fg-prime: #ffffff;
            --fg-muted: rgba(255, 255, 255, 0.4);
            --fg-subtle: rgba(255, 255, 255, 0.6);
            --border-faint: rgba(255, 255, 255, 0.15);
            --border-strong: #ffffff;

            /* Animation Timing / Easing (Phase 3) */
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
            --ease-brisk: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--fg-prime);
            font-family: 'Space Mono', monospace;
            /* Base font is monospace for raw feel */
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow-x: hidden;
            /* Prevent Layout Shifts */
            content-visibility: auto;
        }

        /* Focus rings - Accessibility Phase 6 */
        *:focus-visible {
            outline: 2px solid var(--fg-prime);
            outline-offset: 4px;
        }

        /* SVG Grain Texture - Visual Depth Phase 2 */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.08;
            mix-blend-mode: screen;
            /* Will not trigger repaints as it is static overlay */
        }

        /* Typography */
        h1,
        h2,
        h3,
        .title-font {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }

        .container {
            max-width: 90vw;
            margin: 0 auto;
            padding: clamp(3rem, 8vw, 6rem) 0;
            position: relative;
            z-index: 10;
        }

        /* Header */
        header {
            margin-bottom: clamp(2rem, 5vw, 4rem);
            border-bottom: 1px solid var(--border-faint);
            padding-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        h1.page-title {
            font-size: clamp(3rem, 8vw, 7rem);
            line-height: 0.9;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        /* Staggered text reveal base */
        .header-top {
            overflow: hidden;
        }

        .page-title .word {
            display: inline-block;
            overflow: hidden;
            vertical-align: top;
        }

        .username-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .username {
            font-family: 'Space Mono', monospace;
            color: var(--fg-muted);
            font-size: clamp(1rem, 2vw, 1.25rem);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .badge {
            background-color: transparent;
            color: var(--fg-prime);
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
            border: 1px solid var(--border-strong);
            border-radius: 0;
            /* Brutalism */
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0;
            /* JS fade in */
        }

        /* Controls / Filter Bar */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: clamp(2rem, 5vw, 4rem);
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 1rem;
            align-items: center;
            position: relative;
        }

        label {
            color: var(--fg-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .select-wrapper {
            position: relative;
        }

        select {
            background: transparent;
            color: var(--fg-prime);
            border: 1px solid var(--border-faint);
            padding: 0.75rem 2.5rem 0.75rem 1rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.875rem;
            border-radius: 0;
            cursor: pointer;
            appearance: none;
            transition: border-color 200ms var(--ease-out), transform 150ms var(--ease-brisk);
        }

        .select-wrapper::after {
            content: "↓";
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--fg-prime);
            font-size: 0.8rem;
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: transparent;
        }

        /* Hover animation on fine pointers only (Phase 6) */
        @media (hover: hover) and (pointer: fine) {
            select:hover:not(:disabled) {
                border-color: var(--fg-prime);
            }
        }

        select:active:not(:disabled) {
            transform: scale(0.98);
        }

        select option {
            background: var(--bg-base);
            color: var(--fg-prime);
            font-family: 'Space Mono', monospace;
        }

        /* States */
        .state-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 1.5rem;
            padding: 4rem 0;
            min-height: 40vh;
        }

        .loader-ring {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-faint);
            border-top-color: var(--fg-prime);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .state-message {
            color: var(--fg-subtle);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(clamp(280px, 30vw, 400px), 1fr));
            gap: 1px;
            background-color: var(--border-faint);
            border: 1px solid var(--border-faint);
        }

        /* Repo Card */
        .card {
            background: var(--bg-base);
            padding: clamp(1.5rem, 3vw, 2.5rem);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            position: relative;
            z-index: 1;
            /* Phase 4: Only transioning transform and opacity */
            transition: transform 200ms var(--ease-out);
            will-change: transform, opacity;

            /* Initial hiding for entrance */
            opacity: 0;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid transparent;
            z-index: -1;
            pointer-events: none;
            transition: border-color 200ms var(--ease-out);
        }

        /* Hover states */
        @media (hover: hover) and (pointer: fine) {
            .card:hover {
                z-index: 2;
            }

            .card:hover::before {
                border-color: var(--fg-prime);
            }

            .card:hover .arrow-icon {
                transform: translate(4px, -4px);
                opacity: 1;
            }
        }

        /* Active click state (Asymmetric timing - snappy down, smooth up) */
        .card:active {
            transform: scale(0.97);
            transition: transform 100ms linear;
        }

        .card-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .repo-name {
            font-size: clamp(1.5rem, 2.5vw, 2rem);
            color: var(--fg-prime);
            word-break: break-word;
            line-height: 1.1;
        }

        .arrow-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            fill: none;
            stroke: var(--fg-prime);
            stroke-width: 2;
            stroke-linecap: square;
            opacity: 0.3;
            transition: transform 250ms var(--ease-out), opacity 250ms var(--ease-out);
        }

        .repo-desc {
            color: var(--fg-muted);
            font-size: 0.875rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2rem;
            flex-grow: 1;
        }

        .repo-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .topic-tag {
            font-size: 0.7rem;
            color: var(--fg-prime);
            border: 1px solid var(--border-faint);
            padding: 0.15rem 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .card-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-faint);
            padding-top: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
            align-items: center;
            font-size: 0.75rem;
            color: var(--fg-subtle);
            text-transform: uppercase;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-indicator {
            display: inline-block;
            width: 0.5rem;
            height: 0.5rem;
            background-color: var(--fg-prime);
            border-radius: 0;
            /* Brutalist shape */
        }

        /* Specific SVGs for minimal UI */
        .icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* WAAPI Entrance Classes */
        .is-entering {
            /* Managed by WAAPI */
        }
    </style>
</head>

<body>

    <!-- SVG Filter for Depth / Visual noise -->
    <svg class="grain-overlay" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>

    <div class="container">
        <header>
            <div class="header-top">
                <h1 class="page-title title-font" id="pageTitle">Public Archive</h1>
            </div>
            <div class="username-row">
                <div class="username">
                    <span id="ghUsername">@username</span>
                </div>
                <div class="badge" id="repoCountBadge">0 Indexes</div>
            </div>
        </header>

        <nav class="controls" aria-label="Repository filters">
            <div class="control-group">
                <label for="languageFilter">Lang.</label>
                <div class="select-wrapper">
                    <select id="languageFilter" disabled aria-label="Filter by language">
                        <option value="all">ALL_SYSTEMS</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <label for="sortSelect">Sort.</label>
                <div class="select-wrapper">
                    <select id="sortSelect" disabled aria-label="Sort repositories">
                        <option value="updated">LCL_UPDATED</option>
                        <option value="stars">STAR_METRIC</option>
                        <option value="name">ALPHA_MAP</option>
                    </select>
                </div>
            </div>
        </nav>

        <main id="mainContent">
            <!-- Loading State -->
            <div class="state-container" id="loadingState" aria-live="polite">
                <div class="loader-ring"></div>
                <div class="state-message">Syncing Node...</div>
            </div>

            <!-- Error State -->
            <div class="state-container" id="errorState" style="display: none;" aria-live="assertive">
                <div class="state-message" style="color: #ff3333;">Connection Failed</div>
                <div style="color: var(--fg-muted);" id="errorDesc"></div>
            </div>

            <!-- Empty State -->
            <div class="state-container" id="emptyState" style="display: none;" aria-live="polite">
                <div class="state-message">0 Matches Found</div>
            </div>

            <!-- Grid -->
            <div class="grid" id="repoGrid" role="list"></div>
        </main>
    </div>

    <script>
        /**
         * CONFIGURATION
         */
        const GITHUB_USERNAME = 'vurtal248';
        const GITHUB_API_URL = `https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100`;

        /**
         * STATE
         */
        let state = {
            repos: [],
            languages: new Set(),
            currentFilter: 'all',
            currentSort: 'updated',
            isLoading: true,
            error: null
        };

        /**
         * DOM ELEMENTS
         */
        const el = {
            title: document.getElementById('pageTitle'),
            username: document.getElementById('ghUsername'),
            repoCount: document.getElementById('repoCountBadge'),
            langFilter: document.getElementById('languageFilter'),
            sortSelect: document.getElementById('sortSelect'),
            loadingState: document.getElementById('loadingState'),
            errorState: document.getElementById('errorState'),
            errorDesc: document.getElementById('errorDesc'),
            emptyState: document.getElementById('emptyState'),
            grid: document.getElementById('repoGrid')
        };

        el.username.textContent = `@${GITHUB_USERNAME}`;

        /**
         * MOTION & ANIMATION (Phase 3 & Phase 4)
         */
        // Preferred animation curves
        const curves = {
            easeOut: 'cubic-bezier(0.23, 1, 0.32, 1)',
            easeIn: 'cubic-bezier(0.755, 0.05, 0.855, 0.06)' // Use rarely
        };

        // Check for reduced motion
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function animateTitle() {
            // Split title visually but keep accessible text (Phase 6: Accessibility)
            const text = el.title.textContent;
            el.title.setAttribute('aria-label', text);
            el.title.innerHTML = '';

            const words = text.split(' ');
            let globalCharIndex = 0;

            words.forEach((word, wordIndex) => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                wordSpan.setAttribute('aria-hidden', 'true');

                word.split('').forEach((char) => {
                    const charSpan = document.createElement('span');
                    charSpan.textContent = char;
                    charSpan.style.display = 'inline-block';
                    charSpan.style.opacity = '0';
                    charSpan.style.transform = prefersReducedMotion ? 'none' : 'translateY(100%)';
                    wordSpan.appendChild(charSpan);

                    // WAAPI for programmatic animation
                    charSpan.animate([
                        { transform: prefersReducedMotion ? 'none' : 'translateY(100%)', opacity: 0 },
                        { transform: 'translateY(0)', opacity: 1 }
                    ], {
                        duration: prefersReducedMotion ? 400 : 800,
                        easing: curves.easeOut,
                        fill: 'forwards',
                        delay: prefersReducedMotion ? 0 : globalCharIndex * 40
                    });
                    globalCharIndex++;
                });

                el.title.appendChild(wordSpan);
                if (wordIndex < words.length - 1) {
                    const space = document.createTextNode(' ');
                    el.title.appendChild(space);
                }
            });
        }

        async function animateCardsOut(elements) {
            if (!elements || elements.length === 0) return Promise.resolve();

            const animations = Array.from(elements).map((card, i) => {
                return card.animate([
                    { transform: 'translateY(0) scale(1)', opacity: 1, filter: 'blur(0px)' },
                    { transform: prefersReducedMotion ? 'none' : 'translateY(-10px) scale(0.98)', opacity: 0, filter: 'blur(2px)' }
                ], {
                    duration: prefersReducedMotion ? 150 : 250,
                    easing: curves.easeIn,
                    fill: 'forwards',
                    // exit faster than entering (Asymmetric timing)
                    delay: prefersReducedMotion ? 0 : i * 15
                }).finished;
            });

            return Promise.all(animations);
        }

        function animateCardsIn(elements) {
            if (!elements || elements.length === 0) return;

            Array.from(elements).forEach((card, i) => {
                card.animate([
                    { transform: prefersReducedMotion ? 'none' : 'translateY(20px) scale(0.98)', opacity: 0, filter: 'blur(4px)' },
                    { transform: 'translateY(0) scale(1)', opacity: 1, filter: 'blur(0px)' }
                ], {
                    duration: prefersReducedMotion ? 200 : 500,
                    easing: curves.easeOut,
                    fill: 'forwards',
                    delay: prefersReducedMotion ? 0 : i * 40 // Phase 3.6 Stagger
                });
            });
        }

        /**
         * UTILS
         */
        function formatRelativeTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);

            const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto', style: 'short' });

            if (diffInSeconds < 60) return `${diffInSeconds}s ago`;
            const diffInMinutes = Math.floor(diffInSeconds / 60);
            if (diffInMinutes < 60) return `${diffInMinutes}m ago`;
            const diffInHours = Math.floor(diffInMinutes / 60);
            if (diffInHours < 24) return `${diffInHours}h ago`;
            const diffInDays = Math.floor(diffInHours / 24);
            if (diffInDays < 30) return `${diffInDays}d ago`;
            const diffInMonths = Math.floor(diffInDays / 30);
            if (diffInMonths < 12) return `${diffInMonths}mo ago`;
            const diffInYears = Math.floor(diffInDays / 365);
            return `${diffInYears}y ago`;
        }

        // SVG Assets (Phase 8: Inline SVGs)
        const iconStar = `<svg class="icon" viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"></path></svg>`;
        const iconFork = `<svg class="icon" viewBox="0 0 16 16"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"></path></svg>`;
        const iconArrow = `<svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>`;

        /**
         * RENDER
         */
        function renderCards() {
            let filtered = state.repos;

            // Apply filter
            if (state.currentFilter !== 'all') {
                filtered = filtered.filter(repo => repo.language === state.currentFilter);
            }

            // Apply sort
            filtered.sort((a, b) => {
                if (state.currentSort === 'updated') return new Date(b.updated_at) - new Date(a.updated_at);
                if (state.currentSort === 'stars') return b.stargazers_count - a.stargazers_count;
                if (state.currentSort === 'name') return a.name.localeCompare(b.name);
                return 0;
            });

            const displayRepos = filtered.slice(0, 12);
            el.grid.innerHTML = '';

            if (displayRepos.length === 0) {
                el.emptyState.style.display = 'flex';
                el.grid.style.display = 'none';
                return;
            } else {
                el.emptyState.style.display = 'none';
                el.grid.style.display = 'grid';
            }

            displayRepos.forEach((repo, i) => {
                // Remove animejs dependence, use standard element creation.
                const card = document.createElement('a');
                card.className = 'card';
                card.href = repo.html_url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.role = 'listitem';
                card.style.opacity = '0'; // For initial WAAPI entrance

                const lang = repo.language || 'UND';
                const desc = repo.description || 'NO_DESCRIPTION_PROVIDED';

                let topicsHtml = '';
                if (repo.topics && repo.topics.length > 0) {
                    const topicsList = repo.topics.map(topic => `<span class="topic-tag">${topic}</span>`).join('');
                    topicsHtml = `<div class="repo-topics">${topicsList}</div>`;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="repo-name title-font">${repo.name}</h3>
                        ${iconArrow}
                    </div>
                    <p class="repo-desc">${desc}</p>
                    ${topicsHtml}
                    <div class="card-footer">
                        <div class="stat">
                            <span class="lang-indicator"></span>
                            <span>${lang}</span>
                        </div>
                        <div class="stat">
                            ${iconStar}
                            <span>${repo.stargazers_count}</span>
                        </div>
                        <div class="stat">
                            ${iconFork}
                            <span>${repo.forks_count}</span>
                        </div>
                        <div class="stat" style="margin-left: auto;">
                            <span>${formatRelativeTime(repo.updated_at)}</span>
                        </div>
                    </div>
                `;

                el.grid.appendChild(card);
            });

            // Trigger enter animations
            const newCards = el.grid.querySelectorAll('.card');
            requestAnimationFrame(() => animateCardsIn(newCards));
        }

        async function updateDisplay() {
            const currentCards = el.grid.querySelectorAll('.card');
            if (currentCards.length > 0) {
                await animateCardsOut(currentCards);
            }
            renderCards();
        }

        function populateFilters() {
            state.languages.forEach(lang => {
                if (!lang) return;
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = `LANG_${lang.toUpperCase()}`;
                el.langFilter.appendChild(option);
            });

            el.langFilter.disabled = false;
            el.sortSelect.disabled = false;

            // Event Listeners for Filters
            el.langFilter.addEventListener('change', (e) => {
                state.currentFilter = e.target.value;
                updateDisplay();
            });

            el.sortSelect.addEventListener('change', (e) => {
                state.currentSort = e.target.value;
                updateDisplay();
            });
        }

        /**
         * DATA FETCH
         */
        async function fetchRepos() {
            try {
                const response = await fetch(GITHUB_API_URL);

                if (!response.ok) {
                    throw new Error(`CONNECTION_REFUSED_${response.status}`);
                }

                const data = await response.json();
                state.repos = data;

                // Extract languages
                data.forEach(repo => {
                    if (repo.language) state.languages.add(repo.language);
                });

                // Update UI badges
                el.repoCount.textContent = `[ ${data.length} ] PKGS`;
                el.repoCount.animate([
                    { opacity: 0, transform: 'scale(0.9)' },
                    { opacity: 1, transform: 'scale(1)' }
                ], { duration: 400, easing: curves.easeOut, fill: 'forwards' });

                el.loadingState.style.display = 'none';
                populateFilters();
                renderCards();

            } catch (err) {
                el.loadingState.style.display = 'none';
                el.errorState.style.display = 'flex';
                el.errorDesc.textContent = err.message;
            }
        }

        /**
         * INITIALIZE
         */
        window.addEventListener('DOMContentLoaded', () => {
            // Kickoff routines
            requestAnimationFrame(() => {
                animateTitle();
                fetchRepos();
            });
        });

    </script>
</body>

</html>
